# Локальные стенды для интеграционных тестов certscan.
# Порты публикуются только на 127.0.0.1. Описание стендов — tests/README.md.
# Запуск:    docker compose -f tests/docker-compose.yml up -d openssl-basic
# Остановка: docker compose -f tests/docker-compose.yml down
name: certscan-stands

services:
  # TLS 1.2 и TLS 1.3, самоподписанный сертификат ECDSA P-256.
  openssl-basic:
    build:
      context: ./stands/openssl-basic
    ports:
      - "127.0.0.1:4433:4433"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - stands
    healthcheck:
      test: ["CMD-SHELL", "openssl s_client -connect 127.0.0.1:4433 </dev/null >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s

networks:
  stands:
    driver: bridge
