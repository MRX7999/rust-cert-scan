name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

# Перед публикацией бинарников обязательна ручная проверка зависимостей с
# лицензией строго Apache-2.0 (docs/DECISIONS.md, D-09).
jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          # Нативный arm64-раннер GitHub.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          # Кросс-компиляция на arm64-раннере: Intel-раннер не нужен.
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Канал и компоненты повторяют rust-toolchain.toml (stable, rustfmt, clippy).
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - name: Install musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --locked -p cli --target ${{ matrix.target }}
      # tar.gz для Unix, zip для Windows, рядом файл с SHA256 архива.
      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          name="certscan-${REF_NAME//\//-}-${TARGET}"
          mkdir -p "dist/${name}"
          if [ "${RUNNER_OS}" = "Windows" ]; then
            bin="certscan.exe"
          else
            bin="certscan"
          fi
          cp "target/${TARGET}/release/${bin}" LICENSE README.md "dist/${name}/"
          cp crates/tls-data/data/testssl/NOTICE.md "dist/${name}/NOTICE-testssl.md"
          cd dist
          if [ "${RUNNER_OS}" = "Windows" ]; then
            archive="${name}.zip"
            7z a -tzip "${archive}" "${name}"
          else
            archive="${name}.tar.gz"
            tar -czf "${archive}" "${name}"
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${archive}" > "${archive}.sha256"
          else
            shasum -a 256 "${archive}" > "${archive}.sha256"
          fi
          rm -r "${name}"
          ls -l
      - uses: actions/upload-artifact@v7
        with:
          name: certscan-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  # Публикация только для тегов; при ручном запуске остаются артефакты сборки.
  publish:
    name: publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "${TAG}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${TAG}" \
            --generate-notes \
            --verify-tag
