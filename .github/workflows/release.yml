name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

# Publishing binaries requires the license check in D-09. `cargo deny check`
# gates the publish job. A dependency licensed strictly Apache-2.0, with no
# MIT (or other GPLv2-compatible) alternative, still needs a manual look:
# cargo-deny does not tell that case apart from `MIT OR Apache-2.0`.
jobs:
  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  build:
    name: build (${{ matrix.target }})
    needs: deny
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            smoke: true
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            smoke: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            smoke: true
          - target: aarch64-apple-darwin
            os: macos-latest
            smoke: true
          # Cross-compiled on the arm64 runner. Intel hardware is not required.
          # The binary is packaged; it is not executed here.
          - target: x86_64-apple-darwin
            os: macos-latest
            smoke: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            smoke: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - name: Install musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --locked -p cli --target ${{ matrix.target }}
      - name: Smoke test
        if: matrix.smoke
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: bash .github/scripts/smoke.sh
      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          REF_NAME: ${{ github.ref_name }}
        run: bash .github/scripts/package.sh
      - uses: actions/upload-artifact@v7
        with:
          name: certscan-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  # Tag pushes publish a GitHub Release. A manual run only keeps the artifacts.
  publish:
    name: publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Write SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          find . -mindepth 2 -type f -exec mv -t . {} +
          find . -mindepth 1 -type d -empty -delete
          sha256sum -c ./*.sha256
          cat ./*.sha256 | LC_ALL=C sort > SHA256SUMS
          ls -l
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "${TAG}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${TAG}" \
            --generate-notes \
            --verify-tag
