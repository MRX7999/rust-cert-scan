capture_command = "cargo xtask record-fixture --addr 127.0.0.1:4435 --scenario tls12-dhe-rsa --stand openssl-basic --server 'OpenSSL 4.1.0 23 Oct 2026 (Library: OpenSSL 4.1.0 23 Oct 2026)' --random 059edbc9adcb3f666263cc687b0af2f1efdd66b4df4a0464e44f7b4e7ed36290"
date = "2026-11-11"

[source.conditions]
key_type = "rsa"
cipher = "DHE-RSA-AES256-GCM-SHA384"

[expected]
outcome = "ok"
exchange = "server_hello_done"
summary = "ServerHello TLS 1.2 с шифром DHE-RSA, затем Certificate с RSA-сертификатом, ServerKeyExchange с параметрами DH (p, g, Ys) и подписью, ServerHelloDone"

