format = 1
description = "Ответ на ClientHello TLS 1.2 от стенда с RSA-сертификатом и шифром DHE-RSA: ServerHello, Certificate, ServerKeyExchange, ServerHelloDone"
direction = "server"
request = "tls12-clienthello-openssl-basic-dhe-rsa"
length = 1650

[source]
kind = "stand"
stand = "openssl-basic"
server = "OpenSSL 4.1.0 23 Oct 2026 (Library: OpenSSL 4.1.0 23 Oct 2026)"
